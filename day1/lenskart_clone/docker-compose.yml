services:
  backend:
    build: ./backend
    image: lenskart-clone-backend:latest
    container_name: lenskart-backend
    ports:
      - "5000:5000"
    networks:
      - lenskart-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/products')"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build: ./frontend
    image: lenskart-clone-frontend:latest
    container_name: lenskart-frontend
    environment:
      - API_BASE=http://localhost:5000
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - lenskart-net

networks:
  lenskart-net:
    driver: bridge

[project]
name = "rxflow-ops-mcp"
version = "0.1.0"
description = "Real Azure DevOps Ops MCP server (permission-gated, hooked)"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0,<2.0.0",
    "httpx>=0.27",
    "pydantic>=2.0",
]

[project.scripts]
rxflow-ops-mcp = "rxflow_ops_mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.30",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"

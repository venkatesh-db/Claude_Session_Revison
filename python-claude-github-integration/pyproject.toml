[project]
name = "github-claude-integration-py"
version = "0.1.0"
description = "Claude wired into the GitHub development lifecycle: PR review, CI-failure triage, and patch proposals."
requires-python = ">=3.12"
dependencies = [
    "PyGithub>=2.3",
    "fastapi>=0.111",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
